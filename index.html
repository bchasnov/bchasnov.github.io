<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ben Chasnov</title>
<style>
  :root {
    --bg: #f4f5f7;
    --ink: #1a1d21;
    --ink-soft: #52585f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --ink: #e9edf2;
      --ink-soft: #b0b8c1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 .5rem; }
  p { color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Ben Chasnov</h1>
  <p>bchasnov@gmail.com</p>
</main>
</body>
</html>
